[project]
name = "dassie"
version = "0.1.0"
description = "dassie-50m: a small Llama-style language model trained from scratch on TinyStoriesV2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "tqdm>=4.66",
]

[project.optional-dependencies]
hf = ["transformers>=4.46", "safetensors>=0.4", "huggingface_hub>=0.26"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dassie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
